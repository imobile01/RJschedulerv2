plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rj.scheduler'
    compileSdk 35

    defaultConfig {
        applicationId "com.rj.scheduler"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
