name: Build RJ-Scheduler APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RJ-Scheduler.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RJ-Scheduler-apk
          path: app/build/outputs/apk/debug/*.apk
